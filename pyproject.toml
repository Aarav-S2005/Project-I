[project]
name = "zero-trust-gateway"
version = "0.1.0"
description = "Zero-Trust API Gateway with Graph-Aware Trust Scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authzed>=1.25.0",
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "numba>=0.60.0",
    "numpy>=1.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.8.0",
    "redis>=5.2.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
